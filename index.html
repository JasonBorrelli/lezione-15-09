<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Easy Pomodoro</title>
</head>

<body class="phase-work">
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center p-4">
                        <h1 class="h3 mb-3">🍅 Easy Pomodoro</h1>

                        <span id="phaseBadge" class="badge text-bg-danger fs-6 mb-3">LAVORO</span>

                        <div id="timerDisplay" class="timer-display mb-2" aria-live="polite">00:25:00</div>

                        <p id="cycleLabel" class="fw-semibold mb-1">Ciclo 1 — Lavoro</p>
                        <p class="text-muted mb-1">Rimanenti: <span id="remainingLabel">00:25:00</span></p>
                        <p class="text-muted small mb-3">Pomodori completati: <span id="completedLabel">0</span></p>

                        <div class="progress mb-4" role="progressbar" aria-label="Avanzamento ciclo"
                            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressWrap">
                            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                            <button id="btnStart" type="button" class="btn btn-success">Start</button>
                            <button id="btnPause" type="button" class="btn btn-warning">Pausa</button>
                            <button id="btnStop" type="button" class="btn btn-danger">Stop</button>
                            <button id="btnReset" type="button" class="btn btn-secondary">Reset</button>
                        </div>

                        <hr>

                        <h2 class="h6 text-start mb-3">Durate personalizzabili</h2>
                        <div class="d-flex flex-wrap gap-2 justify-content-start mb-3">
                            <button id="presetClassic" type="button" class="btn btn-sm btn-outline-primary">Classico 25/5</button>
                            <button id="presetLong" type="button" class="btn btn-sm btn-outline-primary">Esteso 50/10</button>
                        </div>
                        <div class="row g-2 align-items-end text-start">
                            <div class="col-6">
                                <label for="workMinutes" class="form-label">Lavoro (min)</label>
                                <input id="workMinutes" type="number" class="form-control" min="1" max="180" value="25">
                            </div>
                            <div class="col-6">
                                <label for="breakMinutes" class="form-label">Riposo (min)</label>
                                <input id="breakMinutes" type="number" class="form-control" min="1" max="60" value="5">
                            </div>
                            <div class="col-12">
                                <button id="btnApply" type="button" class="btn btn-primary w-100 mt-2">Applica durate</button>
                                <p class="form-text mt-1">Le nuove durate si applicano a timer fermo (non mentre scorre).</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cycleToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Easy Pomodoro</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Chiudi"></button>
            </div>
            <div id="toastBody" class="toast-body">Ciclo aggiornato.</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="JS/app.js" defer></script>
</body>

</html>
